name: Test cases (branch v4)
on: push
jobs:
  test_on_push:
    runs-on: self-hosted
    steps:
      - name: Check out code with submodules
        uses: actions/checkout@v2
      - name: Install Python test dependencies
        run: python3 -m pip install -r test/posix/requirements.txt
      - name: Run local DTLS regression tests
        run: |
          sh lib/tinydtls/tests/run_tests.sh
          sh test/posix/run_unit_tests.sh
      - name: Build and test library
        run: |
          cd test/posix
          make clean
          make
          export TRACKLE_ID_LIB_TEST="${{ secrets.TRACKLE_ID_LIB_TEST }}"
          export TRACKLE_PRIVATE_KEY_LIB_TEST="
          ${{ secrets.TRACKLE_PRIVATE_KEY_LIB_TEST }}
          "
          export TRACKLE_CLIENT_ID_LIB_TEST="${{ secrets.TRACKLE_CLIENT_ID_LIB_TEST }}"
          export TRACKLE_CLIENT_SECRET_LIB_TEST="${{ secrets.TRACKLE_CLIENT_SECRET_LIB_TEST }}"
          python3 test.py
      - name: Build and test library - Internal buffer 32kb, 4 concurrent
        run: |
          cd test/posix
          make clean
          make DLL_FLAGS_EXTRA="-DTRACKLE_BLOCKS_NUMBER=32 -DTRACKLE_CONCURRENT_MESSAGES=4"
          export TRACKLE_ID_LIB_TEST="${{ secrets.TRACKLE_ID_LIB_TEST }}"
          export TRACKLE_PRIVATE_KEY_LIB_TEST="
          ${{ secrets.TRACKLE_PRIVATE_KEY_LIB_TEST }}
          "
          export TRACKLE_CLIENT_ID_LIB_TEST="${{ secrets.TRACKLE_CLIENT_ID_LIB_TEST }}"
          export TRACKLE_CLIENT_SECRET_LIB_TEST="${{ secrets.TRACKLE_CLIENT_SECRET_LIB_TEST }}"
          python3 test_buffer.py
      - name: Build and test library - External buffer 32kb, 4 concurrent
        run: |
          cd test/posix
          make clean
          make DLL_FLAGS_EXTRA="-DTRACKLE_USE_EXTERNAL_BUFFER -DTRACKLE_BLOCKS_NUMBER=32 -DTRACKLE_CONCURRENT_MESSAGES=4"
          export TRACKLE_ID_LIB_TEST="${{ secrets.TRACKLE_ID_LIB_TEST }}"
          export TRACKLE_PRIVATE_KEY_LIB_TEST="
          ${{ secrets.TRACKLE_PRIVATE_KEY_LIB_TEST }}
          "
          export TRACKLE_CLIENT_ID_LIB_TEST="${{ secrets.TRACKLE_CLIENT_ID_LIB_TEST }}"
          export TRACKLE_CLIENT_SECRET_LIB_TEST="${{ secrets.TRACKLE_CLIENT_SECRET_LIB_TEST }}"
          python3 test_buffer.py          